<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 75 1200 350" width="1200" height="350">
  <title>RVLION</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#14233f"/>
      <stop offset=".55" stop-color="#0b1629"/>
      <stop offset="1" stop-color="#050b16"/>
    </radialGradient>

    <linearGradient id="plat" gradientUnits="userSpaceOnUse" x1="150" y1="170" x2="1050" y2="330">
      <stop offset="0" stop-color="#7f8a99"/>
      <stop offset=".2" stop-color="#e6ebf1"/>
      <stop offset=".4" stop-color="#a7b0bd"/>
      <stop offset=".62" stop-color="#f8fafc"/>
      <stop offset=".82" stop-color="#bcc4cf"/>
      <stop offset="1" stop-color="#76808e"/>
    </linearGradient>

    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="-420" y1="150" x2="-160" y2="350">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f5f9ff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="0 0;1750 0;1750 0" keyTimes="0;.32;1" calcMode="spline"
        keySplines=".45 0 .25 1;0 0 1 1" dur="7s" begin="4.4s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- left-to-right reveal of the solid letterforms -->
    <linearGradient id="wipeG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".86" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="wipe" maskUnits="userSpaceOnUse" x="0" y="75" width="1200" height="350">
      <rect x="-1700" y="75" width="1700" height="350" fill="url(#wipeG)">
        <animate attributeName="x" from="-1700" to="0" dur="2.2s" begin="1.5s" fill="freeze"
          calcMode="spline" keyTimes="0;1" keySplines=".6 0 .25 1"/>
      </rect>
    </mask>

    <filter id="glow" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <style>
      @keyframes draw    { to { stroke-dashoffset: 0; } }
      @keyframes settle  { to { opacity: .45; } }
      @keyframes glowIn  { to { opacity: .3; } }
      @keyframes breathe { 0%,100% { opacity: .3; } 50% { opacity: .55; } }

      .line { animation: settle 1.2s ease 3.6s forwards; }
      .line path { fill: none; stroke: #d3dbe5; stroke-width: 1; stroke-linejoin: round;
                    stroke-dasharray: 1 1; stroke-dashoffset: 1;
                    animation: draw 1.6s cubic-bezier(.65,0,.35,1) forwards; }
      .solid path { fill: url(#plat); }
      .sheen { opacity: .75; }
      .sheen path { fill: url(#sheen); }
      .glow { opacity: 0; animation: glowIn 1.6s ease 3.2s forwards, breathe 6s ease-in-out 4.8s infinite; }
      .glow path { fill: #b8c7dc; }

      .line .g0 { animation-delay: .15s; } .line .g1 { animation-delay: .30s; } .line .g2 { animation-delay: .45s; }
      .line .g3 { animation-delay: .60s; } .line .g4 { animation-delay: .75s; } .line .g5 { animation-delay: .90s; }

      @media (prefers-reduced-motion: reduce) {
        .line path { animation: none; stroke-dashoffset: 0; }
        .line { animation: none; opacity: .45; }
        .glow { animation: none; opacity: .3; }
      }
    </style>
  </defs>

  <rect x="0" y="75" width="1200" height="350" fill="url(#bg)"/>

